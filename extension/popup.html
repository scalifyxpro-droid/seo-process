<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SEO Growth Inspector</title>
  <style>
    body {
      width: 380px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-weight: 700;
      font-size: 14px;
      color: #38bdf8;
    }
    .metric-row {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .metric-label {
      font-size: 11px;
      text-transform: uppercase;
      color: #94a3b8;
      font-weight: 600;
      margin-bottom: 2px;
      display: flex;
      justify-content: space-between;
    }
    .metric-val {
      font-size: 12px;
      color: #f1f5f9;
      word-break: break-all;
    }
    .badge {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
    }
    .badge-ok { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-warn { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .badge-err { background: rgba(244, 63, 94, 0.2); color: #f87171; }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      padding: 8px 0;
      border-radius: 6px;
      text-decoration: none;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">🚀 SEO Growth Inspector</div>
    <span style="font-size: 11px; color: #64748b;">100-Day OS</span>
  </div>

  <div id="results">
    <div style="text-align: center; color: #94a3b8; padding: 20px;">Analyzing current page...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
