<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Primary Electric Surge Gradient -->
    <linearGradient id="electricSurge" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Accent Emerald Gradient -->
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Subtle Radial Background Bloom -->
  <circle cx="360" cy="150" r="140" fill="#38bdf8" opacity="0.12"/>
  <circle cx="160" cy="360" r="140" fill="#10b981" opacity="0.08"/>

  <!-- Grid Graph Elements (SEO Technical Grid) -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 6">
    <line x1="80" y1="160" x2="432" y2="160"/>
    <line x1="80" y1="256" x2="432" y2="256"/>
    <line x1="80" y1="352" x2="432" y2="352"/>
    <line x1="160" y1="80" x2="160" y2="432"/>
    <line x1="256" y1="80" x2="256" y2="432"/>
    <line x1="352" y1="80" x2="352" y2="432"/>
  </g>

  <!-- Surging Growth Chart Curve (Exponential Organic Traffic) -->
  <path d="M 88 384 C 180 376, 230 330, 290 230 C 330 160, 370 120, 420 100" 
        fill="none" 
        stroke="url(#electricSurge)" 
        stroke-width="28" 
        stroke-linecap="round"
        filter="url(#neonGlow)"/>

  <!-- Area Fill Under Curve -->
  <path d="M 88 384 C 180 376, 230 330, 290 230 C 330 160, 370 120, 420 100 L 420 410 C 420 410, 88 410, 88 410 Z" 
        fill="url(#electricSurge)" 
        opacity="0.14"/>

  <!-- Growth Milestone Nodes -->
  <circle cx="160" cy="370" r="10" fill="#06b6d4" stroke="#ffffff" stroke-width="4"/>
  <circle cx="280" cy="245" r="12" fill="#38bdf8" stroke="#ffffff" stroke-width="4" filter="url(#subtleGlow)"/>
  
  <!-- High Voltage Lightning & Target Arrow Peak -->
  <!-- Main Rocket / Arrow Head at Top Right Peak (420, 100) -->
  <g transform="translate(416, 96)">
    <!-- Outer Pulsing Ring -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#34d399" stroke-width="6" opacity="0.6"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 6" opacity="0.4"/>
    <!-- Center Core Energy Orb -->
    <circle cx="0" cy="0" r="18" fill="#ffffff" filter="url(#subtleGlow)"/>
    <circle cx="0" cy="0" r="12" fill="#10b981"/>
  </g>

  <!-- Central High-Impact SEO Lightning Bolt -->
  <polygon points="268,140 220,246 270,246 238,340 324,216 274,216" 
           fill="#ffffff" 
           filter="url(#neonGlow)"/>
  <polygon points="266,144 224,244 268,244 240,332 318,218 272,218" 
           fill="url(#emeraldGlow)"/>

  <!-- Search / Optimization Lens Flare Ring (Bottom Left) -->
  <g transform="translate(130, 320)">
    <circle cx="0" cy="0" r="36" fill="none" stroke="#38bdf8" stroke-width="12" opacity="0.9"/>
    <line x1="26" y1="26" x2="52" y2="52" stroke="#38bdf8" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
